<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0C0F">
<title>向天游</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- ══ 密码门 ══ -->
<div id="gate">
  <div class="gate-in">
    <div class="gate-mark">✦</div>
    <h1>向天游</h1>
    <input id="gatePwd" type="password" autocomplete="current-password" placeholder="密码" aria-label="密码">
    <button id="gateGo">进 入</button>
    <div class="gate-err" id="gateErr"></div>
  </div>
</div>

<!-- ══ 顶栏 ══ -->
<header id="topbar">
  <a class="brand" href="#/">向<b>天游</b></a>
  <nav id="navLinks">
    <a href="#/photos" data-nav="photos">照片</a>
    <a href="#/words"  data-nav="words">文字</a>
    <a href="#/blog"   data-nav="blog">博客</a>
  </nav>
  <div class="top-actions">
    <button class="iconbtn" id="themeBtn" title="切换明暗主题" aria-label="切换明暗主题">
      <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></svg>
    </button>
    <button class="iconbtn" id="gearBtn" title="管理" aria-label="管理" hidden>
      <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5v.2a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H2.8a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.4 9a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5v-.2a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1h.2a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>
</header>

<!-- ══ 主视图 ══ -->
<main id="app"></main>

<!-- ══ 播放条 ══ -->
<footer id="player">
  <button class="pl-btn main" id="plPlay" aria-label="播放/暂停">
    <svg class="icon" viewBox="0 0 24 24" style="width:19px;height:19px"><path d="M7 4.5l12 7.5-12 7.5z" fill="currentColor" stroke="none"/></svg>
  </button>
  <div class="pl-info">
    <div class="pl-title" id="plTitle">—</div>
    <div class="pl-artist" id="plArtist"></div>
  </div>
  <button class="pl-btn opt" id="plPrev" aria-label="上一首">
    <svg class="icon" viewBox="0 0 24 24"><path d="M18 5.5v13L8.5 12z" fill="currentColor" stroke="none"/><path d="M6 5v14"/></svg>
  </button>
  <button class="pl-btn opt" id="plNext" aria-label="下一首">
    <svg class="icon" viewBox="0 0 24 24"><path d="M6 5.5v13L15.5 12z" fill="currentColor" stroke="none"/><path d="M18 5v14"/></svg>
  </button>
  <div class="pl-track" id="plTrack" role="slider" aria-label="播放进度" tabindex="0">
    <div class="pl-bar"><div class="pl-prog" id="plProg"></div><div class="pl-knob" id="plKnob"></div></div>
  </div>
  <div class="pl-time" id="plTime">0:00 / 0:00</div>
  <button class="pl-btn opt" id="plMode" aria-label="播放模式"></button>
</footer>
<audio id="audio" preload="metadata"></audio>

<!-- ══ 灯箱 ══ -->
<div id="lb" role="dialog" aria-modal="true" aria-label="照片查看">
  <div id="lb-top">
    <span id="lb-count"></span>
    <span id="lb-name"></span>
    <span class="sp"></span>
    <button class="lb-ib" id="lbOpen" title="新窗口打开原图" aria-label="打开原图">
      <svg class="icon" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-8.5 8.5"/><path d="M19 14v5a1.5 1.5 0 0 1-1.5 1.5h-12A1.5 1.5 0 0 1 4 19V7a1.5 1.5 0 0 1 1.5-1.5H10"/></svg>
    </button>
    <button class="lb-ib" id="lbClose" title="关闭 (Esc)" aria-label="关闭">
      <svg class="icon" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <button class="lb-nav" id="lbPrev" aria-label="上一张">
    <svg class="icon" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
  <button class="lb-nav" id="lbNext" aria-label="下一张">
    <svg class="icon" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
  </button>
  <div id="lb-stage"><img id="lb-img" alt=""></div>
  <div id="lb-spin"><div class="loading"><i></i><i></i><i></i></div></div>
</div>

<div id="toast"></div>

<script src="../vendor/supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
