<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache,must-revalidate">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>博客 · 向天游</title>
<meta name="theme-color" content="#0E1116">
<meta name="description" content="读与行 — 文字、照片与音乐">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5/600.css">

<style>
/* ===== 动态页专属样式（2026-09-11） ===== */
.mp-head{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:14px 18px;
  background:rgba(14,17,22,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border)}
.mp-back{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--border);color:var(--text-dim);font-size:1rem;text-decoration:none;transition:all .2s;flex:0 0 auto}
.mp-back:hover{border-color:var(--border-hover);color:var(--text)}
/* 详情页隐藏本页的「← 返回主页」，避免同时出现两个返回箭头（2026-09-15） */
.mp-head.detail .mp-back{display:none!important}
.mp-head h1{font-family:var(--font-display);font-size:1.15rem;font-weight:500;letter-spacing:2px;flex:1;margin:0}
.mp-head h1 em{font-style:normal;color:var(--accent)}
.mp-stat{font-size:.75rem;color:var(--text-muted);font-family:var(--font-display)}

.mp-list{max-width:640px;margin:0 auto;padding:20px 16px 80px;display:flex;flex-direction:column;gap:16px}

.mp-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 16px 14px;
  animation:mpIn .4s var(--ease) both}
@keyframes mpIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.mp-time{font-size:.72rem;color:var(--text-muted);letter-spacing:.5px;margin-bottom:9px}
.mp-text{font-size:.95rem;line-height:1.85;color:var(--text);word-break:break-word}

/* ===== 块式图文排版（2026-09-14，参考 thelongestway.com）===== */
.mp-body{font-family:'Noto Serif SC','Songti SC','SimSun',Georgia,serif;font-size:1.08rem;line-height:2.05;color:var(--text);letter-spacing:.2px}
.mp-p{margin:0 0 20px;word-break:break-word}
.mp-p:last-child{margin-bottom:0}
.mp-h{font-family:'Noto Serif SC',var(--font-display);font-size:1.26rem;font-weight:600;margin:30px 0 15px;color:var(--text);letter-spacing:.5px}
.mp-fig{margin:22px 0;padding:0}
.mp-fig:first-child{margin-top:0}
.mp-fig-img{width:100%;border-radius:6px;display:block;cursor:zoom-in;background:var(--bg-elevated)}
.mp-figcap{font-size:.88rem;color:var(--text-dim);text-align:center;margin-top:10px;line-height:1.75;letter-spacing:.3px;font-style:italic}

/* 视频（2026-09-15） */
.mp-video{width:100%;border-radius:6px;display:block;background:#000}
.mp-embed{position:relative;width:100%;padding-top:56.25%;border-radius:6px;overflow:hidden;background:#000}
.mp-embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0}

/* ===== 列表页（2026-09-14：动态改为"列表 → 详情"）===== */
.ml-list{max-width:680px;margin:0 auto;padding:16px 16px 70px;display:flex;flex-direction:column;gap:13px}
.ml-item{display:flex;gap:16px;padding:16px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);text-decoration:none;transition:border-color .2s,transform .2s}
.ml-item:hover{border-color:var(--border-hover);transform:translateY(-2px)}
.ml-thumb{width:124px;height:124px;flex:0 0 auto;border-radius:8px;overflow:hidden;background:var(--bg-elevated)}
.ml-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.ml-body{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.ml-title{font-family:'Noto Serif SC','Songti SC','SimSun',serif;font-size:1.2rem;font-weight:600;color:var(--text);margin:0 0 5px;line-height:1.45}
.ml-title-empty{color:var(--text-dim);font-weight:400;font-size:1.04rem}
.ml-meta{font-size:.8rem;color:var(--text-muted);margin-bottom:7px;letter-spacing:.3px}
.ml-excerpt{font-size:.94rem;color:var(--text-dim);line-height:1.85;margin:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
/* 详情页 */
.mp-detail-wrap{max-width:668px;margin:0 auto;padding:18px 16px 80px}
.ml-back{display:inline-flex;align-items:center;gap:6px;font-size:.9rem;color:var(--text-dim);text-decoration:none;margin-bottom:20px;transition:color .2s}
.ml-back:hover{color:var(--accent)}
.mp-detail-title{font-family:'Noto Serif SC','Songti SC','SimSun',serif;font-size:1.95rem;font-weight:700;color:var(--text);margin:0 0 12px;line-height:1.45;letter-spacing:.5px}
.mp-detail-meta{font-size:.86rem;color:var(--text-muted);margin-bottom:24px;padding-bottom:16px;border-bottom:1px solid var(--border);letter-spacing:.3px}
.mp-detail-nav{margin-top:34px;padding-top:18px;border-top:1px solid var(--border);display:flex;justify-content:space-between;gap:12px}
.mp-detail-nav a{font-size:.84rem;color:var(--text-dim);text-decoration:none}
.mp-detail-nav a:hover{color:var(--accent)}
@media(max-width:520px){
  .ml-item{flex-direction:column;gap:10px}
  .ml-thumb{width:100%;height:158px}
}
/* 兜底：display:flex 会覆盖 hidden 属性，必须显式处理（2026-09-12 踩过这个坑） */
.ml-list[hidden],#mpDetail[hidden]{display:none!important}

/* 图片网格：1张=大图 / 2张=两列 / 3-4张=两列 / 5-9张=三列 */
.mp-imgs{display:grid;gap:5px;margin-top:12px}
.mp-imgs.n1{grid-template-columns:1fr}
.mp-imgs.n2,.mp-imgs.n3,.mp-imgs.n4{grid-template-columns:1fr 1fr}
.mp-imgs.n5,.mp-imgs.n6,.mp-imgs.n7,.mp-imgs.n8,.mp-imgs.n9{grid-template-columns:repeat(3,1fr)}
.mp-img{overflow:hidden;border-radius:6px;background:var(--bg-elevated);cursor:zoom-in}
.mp-imgs.n1 .mp-img{max-height:420px}
.mp-imgs.n2 .mp-img,.mp-imgs.n3 .mp-img,.mp-imgs.n4 .mp-img{aspect-ratio:1}
.mp-imgs.n5 .mp-img,.mp-imgs.n6 .mp-img,.mp-imgs.n7 .mp-img,.mp-imgs.n8 .mp-img,.mp-imgs.n9 .mp-img{aspect-ratio:1}
.mp-img img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s var(--ease)}
.mp-img:hover img{transform:scale(1.04)}

/* 音乐条 */
.mp-music{display:flex;align-items:center;gap:10px;margin-top:12px;padding:9px 12px;
  background:var(--bg-elevated);border:1px solid var(--border);border-radius:22px}
.mp-music-btn{width:30px;height:30px;border-radius:50%;background:var(--accent-glow);color:var(--accent);
  display:flex;align-items:center;justify-content:center;font-size:.8rem;flex:0 0 auto;transition:all .2s}
.mp-music-btn:hover{background:var(--accent);color:#0E1116}
.mp-music-btn.playing{background:var(--accent);color:#0E1116}
.mp-music-title{font-size:.82rem;color:var(--text-dim);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ===== 博客页音乐播放器（2026-09-15，与主页播放器风格统一：带进度条/时间/可拖动）===== */
.mp-player{display:flex;align-items:center;gap:12px;margin-top:18px;padding:12px 14px;
  background:var(--bg-elevated);border:1px solid var(--border);border-radius:14px}
.mp-play{width:42px;height:42px;flex:0 0 auto;border-radius:50%;background:var(--accent-glow);color:var(--accent);
  display:flex;align-items:center;justify-content:center;font-size:1rem;line-height:1;transition:all .2s;cursor:pointer}
.mp-play:hover{background:var(--accent);color:#0E1116}
.mp-play.playing{background:var(--accent);color:#0E1116}
.mp-pinfo{flex:1;min-width:0}
.mp-ptitle{font-size:.85rem;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:8px;letter-spacing:.2px}
.mp-pwrap{display:flex;align-items:center;gap:10px}
.mp-pbar{flex:1;position:relative;height:18px;padding:7px 0;background:rgba(var(--fg-rgb),.08);
  background-clip:content-box;border-radius:2px;cursor:pointer;touch-action:none;
  -webkit-user-select:none;user-select:none}
.mp-pprog{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:2px;transition:width .1s linear}
.mp-pthumb{position:absolute;top:50%;left:0;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;
  background:var(--accent-2);box-shadow:0 1px 5px rgba(0,0,0,.5);opacity:0;transition:opacity .18s;pointer-events:none;z-index:2}
.mp-pbar:hover .mp-pthumb,.mp-pbar.dragging .mp-pthumb{opacity:1}
.mp-pbar.dragging{cursor:grabbing}
.mp-ptime{font-size:.72rem;color:var(--text-muted);font-variant-numeric:tabular-nums;flex:0 0 auto;letter-spacing:.3px}

/* 标签 */
.mp-tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.mp-tag{font-size:.72rem;padding:3px 10px;border-radius:14px;background:rgba(var(--fg-rgb),.05);
  border:1px solid var(--border);color:var(--text-dim);letter-spacing:.3px}
.mp-tag-loc{color:var(--accent-2);border-color:rgba(184,100,74,.3)}

/* 空状态 / 提示 */
.mp-empty{text-align:center;padding:90px 24px;color:var(--text-muted)}
.mp-empty-icon{font-size:2.6rem;margin-bottom:16px;opacity:.6}
.mp-empty p{margin:6px 0;font-size:.9rem;line-height:1.7}
.mp-empty-sub{font-size:.78rem!important;opacity:.7}
.mp-loading{text-align:center;padding:70px 0;color:var(--text-muted);font-size:.88rem}

/* 图片全屏查看 */
.mp-viewer{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.94);display:flex;align-items:center;justify-content:center;
  padding:20px;cursor:zoom-out;opacity:0;transition:opacity .25s}
.mp-viewer.show{opacity:1}
.mp-viewer img{max-width:100%;max-height:100%;object-fit:contain;border-radius:3px}
/* 2026-09-12 关键修复：display:flex 会覆盖 HTML 的 hidden 属性，
   导致这个透明全屏层常驻，挡住页面所有点击（表现为鼠标变 zoom-out 光标、什么都点不动） */
.mp-viewer[hidden],.mp-empty[hidden]{display:none!important}
</style>
</head>

<div id="pwdGate" style="position:fixed;inset:0;z-index:9999;background:var(--bg,#0E1116);display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center">
  <div style="max-width:340px;padding:24px;width:100%">
    <div style="font-size:1.6rem;margin-bottom:12px;font-family:var(--font-display,serif);font-style:italic;color:var(--accent,#7C9B7E)">✦</div>
    <div style="font-size:.95rem;font-weight:500;color:var(--text,#E8E4DA);margin-bottom:16px">输入密码</div>
    <div style="position:relative;width:100%;margin-bottom:12px">
      <span style="position:absolute;left:16px;top:50%;transform:translateY(-50%);color:rgba(232,228,218,.4);font-size:.95rem;pointer-events:none;z-index:1;user-select:none">陈</span>
      <input id="pwdInput2" lang="zh-CN" autocapitalize="off" autocorrect="off" spellcheck="false" style="width:100%;padding:12px 16px 12px 40px;background:rgba(232,228,218,.06);border:1px solid rgba(232,228,218,.12);border-radius:10px;color:var(--text,#E8E4DA);font-size:.95rem;outline:none;text-align:left;-webkit-text-security:disc" placeholder="**" autocomplete="off">
    </div>
    <div id="pwdError2" style="font-size:.78rem;color:#e74c3c;margin-bottom:10px;display:none">密码不对，再试试</div>
    <button id="pwdSubmit2" style="width:100%;padding:12px;border:none;border-radius:10px;background:var(--accent,#7C9B7E);color:#fff;font-size:.9rem;font-weight:500;cursor:pointer">进入</button>
  </div>
</div>
<script>
// 密码门（2026-09-15 补）：博客页原先可被直接访问（绕过主页密码），此处用同一标记 _v2pw2 校验
// 2026-09-15 改哈希：源码不再出现明文密码
var _PW_SALT = 'memories-2026';
var _PW_HASH = '15adc3de66e134142320e2af38ad20d0ff12e67b55406682a2307e2a2cbbaf53';
function _pwOk(v, cb){
  var ok = false;
  try{
    var data = new TextEncoder().encode(String(v) + _PW_SALT);
    crypto.subtle.digest('SHA-256', data).then(function(buf){
      var hex = '';
      new Uint8Array(buf).forEach(function(b){ hex += ('0' + b.toString(16)).slice(-2); });
      cb(hex === _PW_HASH);
    }).catch(function(){
      var s = String(v);
      cb(s.length === 2 && s.charCodeAt(0) === 31185 && s.charCodeAt(1) === 20219);
    });
  }catch(e){
    var s2 = String(v);
    cb(s2.length === 2 && s2.charCodeAt(0) === 31185 && s2.charCodeAt(1) === 20219);
  }
}
(function(){
  var gate = document.getElementById('pwdGate');
  if(!gate) return;
  var ok = false;
  try{ ok = localStorage.getItem('_v2pw2') === '1'; }catch(e){}
  if(ok){ if(gate.parentNode) gate.parentNode.removeChild(gate); return; }
  document.documentElement.style.overflow = 'hidden';
  var inp = document.getElementById('pwdInput2');
  var btn = document.getElementById('pwdSubmit2');
  var err = document.getElementById('pwdError2');
  function pass(){
    try{ localStorage.setItem('_v2pw2','1'); }catch(e){}
    document.documentElement.style.overflow = '';
    if(gate.parentNode) gate.parentNode.removeChild(gate);
  }
  function check(){
    _pwOk(inp ? inp.value : '', function(good){
      if(good) pass();
      else if(err) err.style.display = 'block';
    });
  }
  if(btn) btn.onclick = check;
  if(inp){
    inp.onkeydown = function(e){ if(e.key === 'Enter') check(); };
    setTimeout(function(){ try{ inp.focus(); }catch(e){} }, 150);
  }
})();
</script>

<script>
(function(){
  'use strict';
  var SB_URL='https://mvzbkuhwapdqcdkekczh.supabase.co';
  var SB_KEY='sb_publishable_1yOf4jtKqK1GApN3InC7Gg_TUD2Barb';
  var STORAGE=SB_URL+'/storage/v1/object/public/photos/';
  var sb=null;
  try{ sb=supabase.createClient(SB_URL,SB_KEY); }catch(e){ sb=null; }

  function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g,function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function fileUrl(p){
    if(!p) return '';
    return /^https?:/i.test(p) ? p : STORAGE + p;
  }
  function fmtTime(iso){
    var d=new Date(iso); if(isNaN(d.getTime())) return '';
    var hh=('0'+d.getHours()).slice(-2), mm=('0'+d.getMinutes()).slice(-2);
    // 2026-09-12 用户要求：统一用「年月日 + 时刻」，不再显示"今天/昨天"
    return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 '+hh+':'+mm;
  }
  function renderImages(imgs){
    if(!imgs || !imgs.length) return '';
    var n=Math.min(imgs.length,9);
    return '<div class="mp-imgs n'+n+'">'+imgs.slice(0,9).map(function(p){
      var u=esc(fileUrl(p));
      return '<div class="mp-img" data-src="'+u+'"><img src="'+u+'" loading="lazy" decoding="async" alt=""></div>';
    }).join('')+'</div>';
  }
  // 各平台视频链接 → 嵌入播放器地址（2026-09-15 与编辑器保持一致）
  function embedUrlOf(src){
    var u = String(src || '').trim(), m;
    if((m = u.match(/youtube\.com\/watch\?v=([\w-]+)/i)) || (m = u.match(/youtu\.be\/([\w-]+)/i)) || (m = u.match(/youtube\.com\/shorts\/([\w-]+)/i)))
      return 'https://www.youtube.com/embed/' + m[1];
    if((m = u.match(/bilibili\.com\/video\/(BV[\w]+)/i)) || (m = u.match(/b23\.tv\/(BV[\w]+)/i)))
      return 'https://player.bilibili.com/player.html?bvid=' + m[1] + '&autoplay=0&high_quality=1';
    if((m = u.match(/vimeo\.com\/(?:video\/)?(\d+)/i)))
      return 'https://player.vimeo.com/video/' + m[1];
    if((m = u.match(/v\.qq\.com\/x\/cover\/[^/]+\/([\w]+)\.html/i)) || (m = u.match(/v\.qq\.com\/x\/page\/([\w]+)\.html/i)))
      return 'https://v.qq.com/txp/iframe/player.html?vid=' + m[1];
    if((m = u.match(/youku\.com\/v_show\/id_([\w=]+)\.html/i)))
      return 'https://player.youku.com/embed/' + m[1];
    if((m = u.match(/iqiyi\.com\/v_([\w]+)\.html/i)))
      return 'https://open.iqiyi.com/developer/player_js/coopPlayerIndex.html?vid=' + m[1];
    if((m = u.match(/ixigua\.com\/(\d+)/i)))
      return 'https://www.ixigua.com/iframe/' + m[1];
    if((m = u.match(/weibo\.(?:com|cn)\/(?:tv\/show\/|detail\/|[^/]+\/[^/]+\/)([\w:]+)/i)))
      return 'https://weibo.com/tv/show/' + m[1];
    if(/^<iframe/i.test(u)){
      var s = u.match(/src\s*=\s*["']([^"']+)["']/i);
      if(s) return s[1];
    }
    return u;
  }

  // 视频地址：GitHub Releases 的链接在国内直连不通，自动改走加速镜像（2026-09-15）
  function videoUrl(src, alt){
    var s = String(src || '');
    if(!/^https?:\/\/github\.com\/[^/]+\/[^/]+\/releases\/download\//i.test(s)) return s;
    return (alt ? 'https://ghfast.top/' : 'https://gh-proxy.com/') + s;
  }

  function renderBlocks(p){
    var blocks = p.blocks;
    if(!blocks || !blocks.length){
      blocks = [];
      if(p.content) blocks.push({t:'p', text:p.content});
      (p.images || []).forEach(function(s){ blocks.push({t:'img', src:s, cap:''}); });
    }
    return blocks.map(function(b){
      if(b.t === 'img'){
        if(!b.src) return '';
        var u = esc(fileUrl(b.src));
        return '<figure class="mp-fig"><img class="mp-fig-img" src="' + u + '" loading="lazy" decoding="async" alt="">' +
               (b.cap ? '<figcaption class="mp-figcap">' + esc(b.cap) + '</figcaption>' : '') + '</figure>';
      }
      if(b.t === 'h') return '<h3 class="mp-h">' + esc(b.text || '') + '</h3>';
      if(b.t === 'video'){
        if(!b.src) return '';
        var kind = b.kind || 'direct';
        if(kind === 'direct'){
          return '<figure class="mp-fig"><video class="mp-video" src="' + esc(videoUrl(b.src)) + '" '
            + 'data-alt="' + esc(videoUrl(b.src, true)) + '" '
            + 'onerror="if(this.dataset.alt){this.src=this.dataset.alt;this.removeAttribute(\'data-alt\')}" '
            + 'controls preload="metadata" playsinline></video></figure>';
        }
        var embed = embedUrlOf(b.src);
        if(!embed) return '';
        // referrerpolicy=no-referrer（2026-09-15）：不向视频平台发送来源域名，保护网站隐私
        return '<figure class="mp-fig"><div class="mp-embed"><iframe src="' + esc(embed) + '" '
          + 'referrerpolicy="no-referrer" allowfullscreen scrolling="no" frameborder="0" '
          + 'allow="autoplay; fullscreen; picture-in-picture"></iframe></div></figure>';
      }
      return '<p class="mp-p">' + esc(b.text || '').replace(/\n/g, '<br>') + '</p>';
    }).join('');
  }

  function renderPost(p){
    var tags=[];
    if(p.mood)     tags.push('<span class="mp-tag">'+esc(p.mood)+'</span>');
    if(p.weather)  tags.push('<span class="mp-tag">'+esc(p.weather)+'</span>');
    if(p.location) tags.push('<span class="mp-tag mp-tag-loc">📍'+esc(p.location)+'</span>');
    var music = p.music_path ? (
      '<div class="mp-music">'+
        '<button class="mp-music-btn" data-src="'+esc(fileUrl(p.music_path))+'" data-title="'+esc(p.music_title||'')+'" aria-label="播放音乐">▶</button>'+
        '<span class="mp-music-title">'+esc(p.music_title||'音乐')+'</span>'+
      '</div>'
    ) : '';
    return '<article class="mp-card">'+
      '<div class="mp-time">'+esc(fmtTime(p.created_at))+(p.pinned?' · 置顶':'')+'</div>'+
      '<div class="mp-body">'+renderBlocks(p)+'</div>'+
      music+
      (tags.length ? '<div class="mp-tags">'+tags.join('')+'</div>' : '')+
    '</article>';
  }

  // ===== 列表页 / 详情页（2026-09-14）=====
  function excerptOf(p){
    var t = '';
    var blocks = p.blocks || [];
    if(blocks.length){
      t = blocks.filter(function(b){ return b.t !== 'img'; })
                .map(function(b){ return b.text || ''; }).join(' ');
    }else{
      t = p.content || '';
    }
    return t.replace(/\s+/g, ' ').trim();
  }
  // 列表用缩略图（2026-09-15）：上传时会同步生成 thumbs/ 小图，列表加载更快
  function thumbOf(p){
    var blocks = p.blocks || [];
    for(var i = 0; i < blocks.length; i++){
      if(blocks[i].t === 'img' && blocks[i].src) return STORAGE + 'thumbs/' + blocks[i].src;
    }
    if(p.images && p.images.length) return STORAGE + 'thumbs/' + p.images[0];
    return '';
  }
  function thumbFallback(p){
    var blocks = p.blocks || [];
    for(var i = 0; i < blocks.length; i++){
      if(blocks[i].t === 'img' && blocks[i].src) return fileUrl(blocks[i].src);
    }
    if(p.images && p.images.length) return fileUrl(p.images[0]);
    return '';
  }
  function titleOf(p){
    var t = (p.title || '').trim();
    if(t) return t;
    var ex = excerptOf(p);
    return ex ? ex.slice(0, 18) : '（无标题）';
  }
  function shortTitle(p){
    var t = titleOf(p);
    return t.length > 8 ? t.slice(0, 8) + '…' : t;
  }
  function dateOf(p){
    var d = new Date(p.created_at);
    if(isNaN(d.getTime())) return '';
    return d.getFullYear() + '年' + (d.getMonth() + 1) + '月' + d.getDate() + '日';
  }
  function renderListItem(p){
    var thumb = thumbOf(p);
    var ex = excerptOf(p).slice(0, 90);
    var hasTitle = !!(p.title || '').trim();
    // 2026-09-15：标题与日期分开显示（统一保留日期，不因标题是日期而隐藏）
    var meta = dateOf(p);
    if(p.location) meta += (meta ? ' · ' : '') + '📍' + esc(p.location);
    return '<a class="ml-item" href="?id=' + encodeURIComponent(p.id) + '">' +
      (thumb
        ? '<div class="ml-thumb"><img src="' + esc(thumb) + '" loading="lazy" decoding="async" alt="" '
          + 'data-fb="' + esc(thumbFallback(p)) + '" '
          + 'onerror="if(this.dataset.fb){this.src=this.dataset.fb;this.removeAttribute(\'data-fb\')}"></div>'
        : '') +
      '<div class="ml-body">' +
        '<h2 class="ml-title' + (hasTitle ? '' : ' ml-title-empty') + '">' + esc(titleOf(p)) + '</h2>' +
        '<div class="ml-meta">' + meta + '</div>' +
        (ex ? '<p class="ml-excerpt">' + esc(ex) + '</p>' : '') +
      '</div>' +
    '</a>';
  }
  function renderMusicBar(p){
    return '<div class="mp-player">' +
      '<button class="mp-play" data-src="' + esc(fileUrl(p.music_path)) + '" aria-label="播放音乐">▶</button>' +
      '<div class="mp-pinfo">' +
        '<div class="mp-ptitle">' + esc(p.music_title || '音乐') + '</div>' +
        '<div class="mp-pwrap">' +
          '<div class="mp-pbar"><div class="mp-pprog"></div><div class="mp-pthumb"></div></div>' +
          '<span class="mp-ptime">0:00 / --:--</span>' +
        '</div>' +
      '</div>' +
    '</div>';
  }
  function renderDetailView(p, prev, next){
    return '<div class="mp-detail-wrap">' +
      '<a class="ml-back" href="./moments.html">← 返回列表</a>' +
      '<h1 class="mp-detail-title">' + esc(titleOf(p)) + '</h1>' +
      '<div class="mp-detail-meta">' + dateOf(p) +
        (p.mood ? ' · ' + esc(p.mood) : '') +
        (p.weather ? ' · ' + esc(p.weather) : '') +
        (p.location ? ' · 📍' + esc(p.location) : '') +
      '</div>' +
      '<div class="mp-body">' + renderBlocks(p) + '</div>' +
      (p.music_path ? renderMusicBar(p) : '') +
      '<div class="mp-detail-nav">' +
        (prev ? '<a href="?id=' + encodeURIComponent(prev.id) + '">← 上一篇：' + esc(shortTitle(prev)) + '</a>' : '<span></span>') +
        (next ? '<a href="?id=' + encodeURIComponent(next.id) + '">下一篇：' + esc(shortTitle(next)) + ' →</a>' : '<span></span>') +
      '</div>' +
    '</div>';
  }

  // ===== 音乐播放器（2026-09-15：与主页风格统一，带进度条/时间/可拖动）=====
  var audio = null, curBar = null;
  function fmtT(s){
    if(!isFinite(s) || s < 0) s = 0;
    var m = Math.floor(s / 60), ss = Math.floor(s % 60);
    return m + ':' + (ss < 10 ? '0' : '') + ss;
  }
  function ensureAudio(){
    if(audio) return audio;
    audio = new Audio();
    audio.preload = 'metadata';
    audio.addEventListener('timeupdate', function(){
      if(!curBar || !audio.duration) return;
      var pct = (audio.currentTime / audio.duration) * 100;
      var pr = curBar.querySelector('.mp-pprog'), th = curBar.querySelector('.mp-pthumb');
      if(pr) pr.style.width = pct + '%';
      if(th) th.style.left = pct + '%';
      var tm = curBar.querySelector('.mp-ptime');
      if(tm) tm.textContent = fmtT(audio.currentTime) + ' / ' + fmtT(audio.duration);
    });
    audio.addEventListener('loadedmetadata', function(){
      if(!curBar) return;
      var tm = curBar.querySelector('.mp-ptime');
      if(tm) tm.textContent = '0:00 / ' + fmtT(audio.duration);
    });
    audio.addEventListener('play', function(){
      if(!curBar) return;
      var b = curBar.querySelector('.mp-play');
      if(b){ b.textContent = '⏸'; b.classList.add('playing'); }
      // 2026-09-15：通知主页暂停它的背景音乐（避免两首歌打架）
      try{ window.parent.postMessage('blog-music-play', '*'); }catch(e){}
    });
    audio.addEventListener('pause', function(){
      if(!curBar) return;
      var b = curBar.querySelector('.mp-play');
      if(b){ b.textContent = '▶'; b.classList.remove('playing'); }
      // 2026-09-15：本页音乐停下 → 让主页从原进度继续播放
      try{ window.parent.postMessage('blog-music-stop', '*'); }catch(e){}
    });
    audio.addEventListener('waiting', function(){
      if(curBar){ var b = curBar.querySelector('.mp-play'); if(b) b.textContent = '⋯'; }
    });
    audio.addEventListener('playing', function(){
      if(curBar){ var b = curBar.querySelector('.mp-play'); if(b){ b.textContent = '⏸'; b.classList.add('playing'); } }
    });
    audio.addEventListener('ended', function(){
      if(!curBar) return;
      var b = curBar.querySelector('.mp-play');
      if(b){ b.textContent = '▶'; b.classList.remove('playing'); }
      var pr = curBar.querySelector('.mp-pprog'), th = curBar.querySelector('.mp-pthumb');
      if(pr) pr.style.width = '0%';
      if(th) th.style.left = '0%';
    });
    audio.addEventListener('error', function(){
      if(!curBar) return;
      var b = curBar.querySelector('.mp-play');
      if(b){ b.textContent = '▶'; b.classList.remove('playing'); }
      var tm = curBar.querySelector('.mp-ptime');
      if(tm) tm.textContent = '加载失败';
      console.warn('[music] load error');
    });
    return audio;
  }
  function toggleMusic(btn){
    var bar = btn.closest ? btn.closest('.mp-player') : null;
    if(!bar) return;
    var src = btn.getAttribute('data-src');
    if(!src) return;
    var a = ensureAudio();
    if(curBar === bar && !a.paused){ a.pause(); return; }
    if(curBar && curBar !== bar){
      var ob = curBar.querySelector('.mp-play');
      if(ob){ ob.textContent = '▶'; ob.classList.remove('playing'); }
    }
    curBar = bar;
    if(a.src !== src){
      a.src = src;
      var pr = bar.querySelector('.mp-pprog'), th = bar.querySelector('.mp-pthumb');
      if(pr) pr.style.width = '0%';
      if(th) th.style.left = '0%';
      var tm = bar.querySelector('.mp-ptime');
      if(tm) tm.textContent = '0:00 / --:--';
    }
    a.play().catch(function(err){ console.warn('[music] play failed', err); });
  }
  function seekTo(e, barEl){
    var a = audio;
    if(!a || !isFinite(a.duration)) return;
    var rect = barEl.getBoundingClientRect();
    var cx = (e.clientX != null) ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
    var pct = Math.max(0, Math.min(1, (cx - rect.left) / rect.width));
    a.currentTime = pct * a.duration;
  }

  var viewer=document.getElementById('mpViewer');
  var viewerImg=document.getElementById('mpViewerImg');
  function openViewer(src){
    viewerImg.src=src; viewer.hidden=false;
    requestAnimationFrame(function(){ viewer.classList.add('show'); });
    document.body.style.overflow='hidden';
  }
  function closeViewer(){
    viewer.classList.remove('show'); document.body.style.overflow='';
    setTimeout(function(){ viewer.hidden=true; viewerImg.src=''; },250);
  }
  viewer.addEventListener('click', closeViewer);
  document.addEventListener('keydown', function(e){ if(e.key==='Escape' && !viewer.hidden) closeViewer(); });

  function bindEvents(){
    if(bindEvents._done) return;
    bindEvents._done = true;
    document.addEventListener('click', function(e){
      var playBtn = e.target.closest('.mp-play');
      if(playBtn){ toggleMusic(playBtn); return; }
      var musicBtn = e.target.closest('.mp-music-btn');
      if(musicBtn){ toggleMusic(musicBtn); return; }
      var figImg = e.target.closest('.mp-fig-img');
      if(figImg){ openViewer(figImg.getAttribute('src')); return; }
      var imgWrap = e.target.closest('.mp-img');
      if(imgWrap){ openViewer(imgWrap.getAttribute('data-src')); }
    });
    // 进度条：点击 / 拖动跳转（2026-09-15）
    var dragBar = null;
    document.addEventListener('pointerdown', function(e){
      var barEl = e.target.closest('.mp-pbar');
      if(!barEl) return;
      if(!curBar || barEl !== curBar.querySelector('.mp-pbar')) return;
      dragBar = barEl;
      barEl.classList.add('dragging');
      seekTo(e, barEl);
      try{ barEl.setPointerCapture(e.pointerId); }catch(err){}
    });
    document.addEventListener('pointermove', function(e){
      if(dragBar) seekTo(e, dragBar);
    });
    document.addEventListener('pointerup', function(){
      if(dragBar){ dragBar.classList.remove('dragging'); dragBar = null; }
    });
    document.addEventListener('pointercancel', function(){
      if(dragBar){ dragBar.classList.remove('dragging'); dragBar = null; }
    });
  }

  function showEmpty(msg){
    document.getElementById('mpList').innerHTML='';
    var el=document.getElementById('mpEmpty');
    el.hidden=false;
    if(msg){ el.querySelector('p').textContent=msg; el.querySelector('.mp-empty-sub').textContent=''; }
  }

  // 2026-09-15：若在主页的横滑层(iframe)里打开，点「← 返回」时通知父页收起
  (function(){
    if(window.self === window.top) return;   // 独立打开时不变
    var backs = document.querySelectorAll('.mp-back');
    Array.prototype.forEach.call(backs, function(a){
      a.setAttribute('href', 'javascript:void(0)');
      a.addEventListener('click', function(e){
        e.preventDefault();
        try{ window.parent.postMessage('close-blog', '*'); }catch(err){}
      });
    });
  })();

  // 2026-09-15：离开本页（返回列表/切换文章/关闭博客）时，通知主页恢复背景音乐。
  // 因为「← 返回列表」是整页跳转，audio 的 pause 事件不会触发，必须靠 pagehide 兜底。
  (function(){
    function notifyStop(){
      try{ window.parent.postMessage('blog-music-stop', '*'); }catch(e){}
    }
    window.addEventListener('pagehide', notifyStop);
    window.addEventListener('beforeunload', notifyStop);
  })();

  // 访问上报（2026-09-15）：博客页也记录，含"是否通过密码"与设备信息
  (function(){
    try{
      var key='sb_publishable_1yOf4jtKqK1GApN3InC7Gg_TUD2Barb';
      var base='https://mvzbkuhwapdqcdkekczh.supabase.co/rest/v1/visits';
      var cid = null;
      try{ cid = localStorage.getItem('memories.cid'); }catch(e){}
      if(!cid){
        cid = 'c_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
        try{ localStorage.setItem('memories.cid', cid); }catch(e){}
      }
      var body = {
        path: location.pathname + (location.search || ''),
        ref: document.referrer || '',
        visited_at: new Date().toISOString(),
        session_id: cid,
        ua: navigator.userAgent || '',
        is_authed: (function(){ try{ return localStorage.getItem('_v2pw2') === '1'; }catch(e){ return false; } })(),
        screen: (window.screen ? (screen.width + 'x' + screen.height) : ''),
        lang: navigator.language || '',
        tz: (function(){ try{ return Intl.DateTimeFormat().resolvedOptions().timeZone || ''; }catch(e){ return ''; } })()
      };
      fetch(base, {
        method: 'POST',
        headers: {'apikey':key,'Authorization':'Bearer '+key,'Content-Type':'application/json','Prefer':'return=representation'},
        body: JSON.stringify(body)
      }).then(function(r){ return r.json(); }).then(function(data){
        var vid = data && data[0] && data[0].id;
        if(!vid) return;
        var t0 = Date.now();
        function upd(){
          var dur = Math.max(1, Math.round((Date.now() - t0) / 1000));
          fetch(base + '?id=eq.' + vid, {
            method: 'PATCH',
            headers: {'apikey':key,'Authorization':'Bearer '+key,'Content-Type':'application/json'},
            body: JSON.stringify({duration: dur, left_at: new Date().toISOString()}),
            keepalive: true
          }).catch(function(){});
        }
        setInterval(upd, 10000);
        window.addEventListener('beforeunload', upd);
        document.addEventListener('visibilitychange', function(){ if(document.hidden) upd(); });
      }).catch(function(){});
    }catch(e){}
  })();

  async function load(){
    var listEl = document.getElementById('mpList');
    var detailEl = document.getElementById('mpDetail');
    if(!sb){
      listEl.innerHTML = '<div class="mp-loading">⚠️ 云端未连接，请刷新重试</div>';
      return;
    }
    try{
      var res = await sb.from('posts').select('*')
        .order('pinned', {ascending:false})
        .order('created_at', {ascending:false})
        .limit(200);
      if(res.error){
        listEl.innerHTML = '<div class="mp-loading">读取失败：' + esc(res.error.message) + '</div>';
        return;
      }
      var list = res.data || [];
      var idParam = null;
      try{ idParam = new URLSearchParams(location.search).get('id'); }catch(e){}

      if(idParam){
        var p = null;
        for(var i = 0; i < list.length; i++){
          if(String(list[i].id) === String(idParam)){ p = list[i]; break; }
        }
        if(!p){
          listEl.innerHTML = '<div class="mp-loading">这篇内容不存在（可能已被删除）<br><br><a href="./moments.html" style="color:var(--accent);text-decoration:none">← 返回列表</a></div>';
          return;
        }
        var idx = list.indexOf(p);
        // 列表按时间倒序（最新在最上）：
        //   idx-1 → 列表里更靠上 = 更新的一篇 = 「上一篇」（放左边）
        //   idx+1 → 列表里更靠下 = 更早的一篇 = 「下一篇」（放右边）
        var prev = (idx - 1 >= 0) ? list[idx - 1] : null;
        var next = (idx + 1 < list.length) ? list[idx + 1] : null;
        listEl.hidden = true;
        listEl.innerHTML = '';
        detailEl.innerHTML = renderDetailView(p, prev, next);
        detailEl.hidden = false;
        // 2026-09-15：详情页隐藏博客页自己的「← 返回主页」（此时已有「← 返回列表」）
        var hd = document.querySelector('.mp-head');
        if(hd) hd.classList.add('detail');
        var stat = document.getElementById('mpStat');
        if(stat) stat.textContent = '';
        document.title = titleOf(p) + ' · 向天游';
        bindEvents();
        window.scrollTo(0, 0);
        return;
      }

      var stat2 = document.getElementById('mpStat');
      if(stat2) stat2.textContent = list.length ? list.length + ' 篇' : '';
      if(!list.length){ showEmpty(); return; }
      listEl.innerHTML = list.map(renderListItem).join('');
      listEl.hidden = false;
      detailEl.hidden = true;
      var hd2 = document.querySelector('.mp-head');
      if(hd2) hd2.classList.remove('detail');
      bindEvents();
    }catch(err){
      listEl.innerHTML = '<div class="mp-loading">加载出错，请刷新重试</div>';
    }
  }

  load();
})();
</script>
</body>
