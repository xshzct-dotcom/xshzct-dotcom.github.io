*{box-sizing:border-box}
body{background:#0E1116;color:#E8E4DA;font-family:system-ui,sans-serif;margin:0;padding:24px 16px;max-width:720px;margin:0 auto;min-height:100vh}
h1{font-size:1.3rem;font-weight:600;text-align:center;margin:0 0 4px;letter-spacing:.5px}
h1 em{font-style:italic;color:#7C9B7E;font-weight:400}
.sub{text-align:center;color:rgba(232,228,218,.35);font-size:.8rem;margin-bottom:18px}

/* 日期导航 */
.date-nav{background:rgba(232,228,218,.04);border:1px solid rgba(232,228,218,.08);border-radius:12px;padding:12px;margin-bottom:18px;display:flex;align-items:center;gap:8px}
.date-nav .nav-btn{flex-shrink:0;width:36px;height:36px;border-radius:8px;border:1px solid rgba(232,228,218,.1);background:transparent;color:rgba(232,228,218,.5);font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.date-nav .nav-btn:hover{background:rgba(232,228,218,.06);color:#E8E4DA}
.date-nav input[type=date]{flex:1;background:rgba(232,228,218,.05);border:1px solid rgba(232,228,218,.1);border-radius:8px;padding:8px 12px;color:#E8E4DA;font-size:.95rem;font-family:inherit;text-align:center;outline:none;cursor:pointer;min-width:0}
.date-nav input[type=date]::-webkit-calendar-picker-indicator{filter:invert(.7);cursor:pointer}
.date-nav .today-btn{padding:0 12px;height:36px;border-radius:8px;border:1px solid rgba(124,155,126,.4);background:transparent;color:#7C9B7E;font-size:.78rem;cursor:pointer;font-family:inherit}
.date-nav .today-btn:hover{background:rgba(124,155,126,.15)}

.overview{display:flex;gap:10px;margin-bottom:18px}
.overview>div{flex:1;background:rgba(232,228,218,.03);border:1px solid rgba(232,228,218,.07);border-radius:10px;padding:14px 8px;text-align:center;position:relative;overflow:hidden}
/* 2026-09-15 ⑦：数字卡加极淡网格纹理作底（同样的"淡化图像"思路，用数据图形代替照片） */
.overview>div::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(90deg,rgba(232,228,218,.05) 1px,transparent 1px),
                   linear-gradient(rgba(232,228,218,.05) 1px,transparent 1px);
  background-size:13px 13px;
  -webkit-mask-image:linear-gradient(155deg,#000 8%,transparent 70%);
  mask-image:linear-gradient(155deg,#000 8%,transparent 70%);
}
.overview>div>*{position:relative;z-index:1}
.overview .n{font-size:1.8rem;font-weight:700;line-height:1.2}
.overview .l{font-size:.72rem;margin-top:3px;color:rgba(232,228,218,.4);text-transform:uppercase;letter-spacing:.5px}

.section{background:rgba(232,228,218,.03);border:1px solid rgba(232,228,218,.07);border-radius:12px;padding:18px;margin-bottom:14px}
.section h2{font-size:.85rem;color:rgba(232,228,218,.4);margin:0 0 14px;font-weight:500;letter-spacing:.5px;text-transform:uppercase}

.bar-row{display:flex;align-items:center;gap:6px;margin:3px 0;padding:2px 0}
.bar-row .dt{font-size:.75rem;color:rgba(232,228,218,.35);width:50px;flex-shrink:0}
.bar-row .bar{height:7px;border-radius:4px;background:#7C9B7E;min-width:3px;transition:width .5s;opacity:.8}
.bar-row .cnt{font-size:.78rem;color:rgba(232,228,218,.5);min-width:18px;text-align:right}

.list-item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid rgba(232,228,218,.05);font-size:.85rem}
.list-item:last-child{border-bottom:none}
.list-item .p{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:rgba(232,228,218,.7)}
.list-item .c{color:rgba(232,228,218,.5);font-weight:600;min-width:20px;text-align:right}

.hour-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:8px}
.hour-cell{text-align:center;padding:8px 0;border-radius:6px;background:rgba(232,228,218,.04);font-size:.75rem;color:rgba(232,228,218,.45)}
.hour-cell .hc{font-size:.95rem;font-weight:600;color:#E8E4DA;display:block;margin-bottom:1px}
.hour-cell.hot{background:rgba(124,155,126,.2)}
.hour-cell.warm{background:rgba(124,155,126,.1)}

.scroll{overflow-x:auto;margin-top:6px}
table{width:100%;border-collapse:collapse;font-size:.8rem}
thead th{text-align:left;padding:6px 8px;color:rgba(232,228,218,.35);font-weight:500;border-bottom:1px solid rgba(232,228,218,.08);white-space:nowrap}
tbody td{padding:5px 8px;border-bottom:1px solid rgba(232,228,218,.04);white-space:nowrap;color:rgba(232,228,218,.65)}
tbody tr:hover td{background:rgba(232,228,218,.03)}
tbody .p{max-width:160px;overflow:hidden;text-overflow:ellipsis}
tbody .r{max-width:120px;overflow:hidden;text-overflow:ellipsis;color:rgba(232,228,218,.4)}

.msg{text-align:center;color:rgba(232,228,218,.25);padding:50px 0;font-size:.9rem}
.msg.ld{color:rgba(232,228,218,.15);font-size:.8rem}
.empty{color:rgba(232,228,218,.25);text-align:center;padding:14px;font-size:.85rem}
.day-label{text-align:center;color:rgba(232,228,218,.35);font-size:.75rem;margin-top:4px}
</style>

<script>
// 密码门（2026-09-15 补）：统计页含访客数据，用同一标记 _v2pw2 校验；2026-09-15 改哈希
var _PW_SALT = 'memories-2026';
var _PW_HASH = '15adc3de66e134142320e2af38ad20d0ff12e67b55406682a2307e2a2cbbaf53';
function _pwOk(v, cb){
  function fallback(){
    var s = String(v);
    cb(s.length === 2 && s.charCodeAt(0) === 31185 && s.charCodeAt(1) === 20219);
  }
  try{
    var data = new TextEncoder().encode(String(v) + _PW_SALT);
    crypto.subtle.digest('SHA-256', data).then(function(buf){
      var hex = '';
      new Uint8Array(buf).forEach(function(b){ hex += ('0' + b.toString(16)).slice(-2); });
      cb(hex === _PW_HASH);
    }).catch(fallback);
  }catch(e){ fallback(); }
}
(function(){
  
  var gate = document.getElementById('pwdGate');
  if(!gate) return;
  var ok = false;
  try{ ok = localStorage.getItem('_v2pw2') === '1'; }catch(e){}
  if(ok){ if(gate.parentNode) gate.parentNode.removeChild(gate); return; }
  document.documentElement.style.overflow = 'hidden';
  var inp = document.getElementById('pwdInputS');
  var btn = document.getElementById('pwdSubmitS');
  var err = document.getElementById('pwdErrorS');
  function pass(){
    try{ localStorage.setItem('_v2pw2','1'); }catch(e){}
    document.documentElement.style.overflow = '';
    if(gate.parentNode) gate.parentNode.removeChild(gate);
  }
  function check(){
    _pwOk(inp ? inp.value : '', function(good){
      if(good) pass();
      else if(err) err.style.display = 'block';
    });
  }
  if(btn) btn.onclick = check;
  if(inp){
    inp.onkeydown = function(e){ if(e.key === 'Enter') check(); };
    setTimeout(function(){ try{ inp.focus(); }catch(e){} }, 150);
  }
})();
</script>

function devName(ua){
  ua = String(ua||'');
  var os = '未知设备';
  if(/iPhone/i.test(ua)) os='iPhone';
  else if(/iPad/i.test(ua)) os='iPad';
  else if(/Android/i.test(ua)) os='Android';
  else if(/Windows/i.test(ua)) os='Windows';
  else if(/Macintosh|Mac OS X/i.test(ua)) os='Mac';
  else if(/Linux/i.test(ua)) os='Linux';
  var br = '';
  if(/Edg\//i.test(ua)) br='Edge';
  else if(/OPR\/|Opera/i.test(ua)) br='Opera';
  else if(/Firefox\//i.test(ua)) br='Firefox';
  else if(/Chrome\//i.test(ua)) br='Chrome';
  else if(/Safari\//i.test(ua)) br='Safari';
  return os + (br ? ' · '+br : '');
}

async function render(){
  document.getElementById('content').innerHTML = '<div class="msg ld">加载中···</div>';
  try{
    // 选中的当天（北京时间 UTC+8 的一天）
    var dayStart = currentDate + 'T00:00:00+08:00';
    var nextDay = addDays(currentDate, 1) + 'T00:00:00+08:00';

    // 当天记录（用 SDK，和主页同款）
    var q1 = await SB.from('visits').select('id,path,ref,visited_at,left_at,duration,ua,is_authed,screen,lang,tz,ip,country,region,city')
      .gte('visited_at', dayStart)
      .lt('visited_at', nextDay)
      .order('visited_at', {ascending:false})
      .limit(1000);
    if(q1.error) throw q1.error;
    var visits = q1.data || [];

    // 总访问量（全部）
    var q2 = await SB.from('visits').select('id', {count:'exact', head:true});
    if(q2.error) throw q2.error;
    var total = q2.count || 0;

    // 当天数据计算
    var hourly=new Array(24).fill(0), pageMap={}, refMap={}, durSum=0, durN=0;
    var authedN=0, guestN=0, guestRows=[];
    (visits||[]).forEach(function(d){
      // visited_at 来自 Supabase timestamp with time zone：ISO UTC 字符串（如 "2026-07-25T03:31:01.000Z"）
      // 用户机器为北京时间（UTC+8），dt.getHours() 直接返回北京小时
      var dt=new Date(d.visited_at);
      var h=dt.getHours(); if(!isNaN(h)&&h>=0&&h<24) hourly[h]++;
      if(d.path) pageMap[d.path]=(pageMap[d.path]||0)+1;
      if(d.ref&&d.ref!='') refMap[d.ref]=(refMap[d.ref]||0)+1;
      if(d.duration){durSum+=d.duration; durN++;}
      // 2026-09-15：区分自己人/外人
      //   is_authed=null 或 ua 为空 → 加字段前的旧记录，无法判断，不计入
      if(d.is_authed === true) authedN++;
      else if(d.is_authed === false && d.ua){ guestN++; guestRows.push(d); }
    });
    var avgDur=durN?Math.round(durSum/durN):0;
    var pages=Object.keys(pageMap).sort(function(a,b){return pageMap[b]-pageMap[a];}).slice(0,15);
    var maxPage=pages.length?Math.max.apply(null,pages.map(function(p){return pageMap[p];})):1;
    var maxH=Math.max.apply(null,hourly)||1;

    var todayCount = visits ? visits.length : 0;
    var dateLabel = currentDate === todayStr() ? '今天' : (currentDate < todayStr() ? currentDate : currentDate);
    var isToday = currentDate === todayStr();

    var html='';
    // 概览
    html+='<div class="overview"><div><div class="n">'+(total||0)+'</div><div class="l">总访问</div></div>';
    html+='<div><div class="n">'+(todayCount||0)+'</div><div class="l">'+(isToday?'今日':'当日')+'</div></div>';
    html+='<div><div class="n">'+(avgDur?fmt(avgDur):'--')+'</div><div class="l">平均停留</div></div></div>';

    // 访客构成（2026-09-15）：通过密码 / 未通过密码（客观描述，不做身份判断）
    if(authedN + guestN > 0){
      html+='<div class="section"><h2>🔐 访问构成</h2><div class="overview">';
      html+='<div><div class="n" style="color:#7C9B7E">'+authedN+'</div><div class="l">通过密码的访问</div></div>';
      html+='<div><div class="n" style="color:#e6a23c">'+guestN+'</div><div class="l">未通过密码的访问</div></div>';
      html+='</div></div>';
      if(guestRows.length){
        html+='<div class="section"><h2>👀 未通过密码的访问（停在密码页，看不到内容）</h2>';
        html+='<div style="font-size:.82rem;line-height:1.9">';
        guestRows.slice(0,20).forEach(function(d){
          var dt=new Date(d.visited_at);
          var t=(dt.getMonth()+1)+'/'+dt.getDate()+' '+('0'+dt.getHours()).slice(-2)+':'+('0'+dt.getMinutes()).slice(-2);
          var dev=/Mobile|Android|iPhone|iPad/i.test(d.ua||'')?'📱手机':'💻电脑';
          var loc=[d.city,d.region,d.country].filter(Boolean).join(' · ');
          if(!loc && d.tz) loc = d.tz.replace('Asia/','').replace(/_/g,' ');   // 2026-09-15：IP 无数据时用时区兜底
          if(!loc) loc = '—';
          html+='<div style="padding:6px 0;border-bottom:1px solid rgba(255,255,255,.06)">'+t+' · '+dev+' · '+loc
              +' · 停留 '+(d.duration?fmt(d.duration):'--')+'</div>';
        });
        html+='</div></div>';
      }
    }

    // 时段分布
    html+='<div class="section"><h2>🕐 时段分布</h2><div class="hour-grid">';
    for(var i=0;i<24;i++){
      var pct=hourly[i]/maxH;
      html+='<div class="hour-cell'+(pct>.6?' hot':pct>.3?' warm':'')+'"><span class="hc">'+(hourly[i]||0)+'</span>'+(i<10?'0':'')+i+':00</div>';
    }
    html+='</div></div>';

    // 详情
    html+='<div class="section"><h2>📋 每一次访问（含访客信息）</h2><div class="scroll"><table><thead><tr><th>时间</th><th>页面</th><th>停留</th><th>访客地区</th><th>来源</th></tr></thead><tbody>';
    // 2026-09-16：同一次访问会写多条记录，但只有第一条查了 IP 归属地
    //   → 先按 session_id 收集"有地区"的那条，渲染时补全，避免大量"未知"的假象
    var geoBySession = {};
    (visits||[]).forEach(function(d){
      if(d.session_id && (d.ip || d.country)){
        var g = geoBySession[d.session_id];
        // 已有则保留信息更全的那条
        var score = (x)=> ((x.country?2:0) + (x.city?1:0));
        if(!g || score(d) > score(g)) geoBySession[d.session_id] = d;
      }
    });
    (visits||[]).forEach(function(d){
      // 补全：本条没地区时，用同会话的记录顶上
      if((!d.ip && !d.country) && d.session_id && geoBySession[d.session_id]){
        var g2 = geoBySession[d.session_id];
        d = Object.assign({}, d, { ip:g2.ip, country:g2.country, region:g2.region, city:g2.city });
      }
      var time = '--';
      // 2026-09-10 修正：数据库现在存的是标准 UTC（写入端已改为 toISOString()）
      // 用 Date 解析后按浏览器本地时区（北京时间）显示
      if(d.visited_at){
        var _dt = new Date(d.visited_at);
        if(!isNaN(_dt.getTime())){
          var hh = String(_dt.getHours()).padStart(2,'0');
          var mi = String(_dt.getMinutes()).padStart(2,'0');
          var ss = String(_dt.getSeconds()).padStart(2,'0');
          time = hh+':'+mi+':'+ss;
        }
      }
      var dur=d.duration?fmt(d.duration):'--';
      // 2026-09-16：访客信息 —— 以【地区】为主（比 IP 直观），设备与身份为辅
      var cityTxt = String(d.city||'').trim();
      var regTxt  = String(d.region||'').trim();
      var cty     = String(d.country||'').trim();
      // 城市/省份往往重复或为空，去重后拼接
      var parts = [cty, regTxt];
      if(cityTxt && cityTxt !== regTxt && cityTxt.indexOf(regTxt) < 0 && regTxt.indexOf(cityTxt) < 0) parts.push(cityTxt);
      // 2026-09-16：译成中文（表里没有的原样保留，不硬翻）
      var loc = parts.filter(Boolean).map(function(x){ return esc(zh(x)); }).join(' · ') || '地区未知';
      var dev = devName(d.ua) + (d.screen ? ' · '+esc(d.screen) : '');
      var gate = d.is_authed ? '<span style="color:rgba(124,155,126,.85)">已通过密码</span>' : '<span style="color:rgba(216,123,107,.85)">仅到密码页</span>';
      var visitor = '<span style="color:rgba(232,228,218,.86);font-weight:500">'+loc+'</span>'
                  + '<br><span style="font-size:.7rem;color:rgba(232,228,218,.42)">'+dev+'</span>'
                  + '<br><span style="font-size:.68rem">'+gate+'</span>';
      html+='<tr><td style="color:rgba(232,228,218,.4);font-size:.75rem">'+time+'</td><td class="p" style="font-size:.76rem">'+esc(String(d.path||'/').split('?')[0])+'</td><td style="font-size:.78rem;color:'+(d.duration?'rgba(124,155,126,.7)':'rgba(232,228,218,.2)')+'">'+dur+'</td><td style="font-size:.75rem;white-space:nowrap">'+visitor+'</td><td class="r" style="font-size:.7rem">'+(d.ref?esc(d.ref):'--')+'</td></tr>';
    });
    if(!visits||!visits.length) html+='<tr><td colspan="5" class="empty">当天无访问记录</td></tr>';
    html+='</tbody></table></div></div>';

    document.getElementById('content').innerHTML=html;
  }catch(e){
    // 2026-09-06：Supabase 不通时回退到 localStorage 显示本机访问记录
    var detail = (e && e.message) ? e.message : String(e);
    var localHTML = '<div class="msg">⚠️ 无法连接 Supabase（'+esc(detail)+'）<br><br>以下显示的是 <strong>本机浏览器</strong>累积的访问记录（仅这台机器）：<br></div>';
    try{
      var visits = JSON.parse(localStorage.getItem('memories.visits') || '[]');
      if(visits.length === 0){
        localHTML += '<div class="msg">本机暂无访问记录。<br>先在主页 <a href="https://xshzct-dotcom.github.io/memories/">xshzct-dotcom.github.io/memories/</a> 访问一次，浏览器会累积记录。</div>';
      } else {
        var hourly=new Array(24).fill(0), pageMap={};
        visits.forEach(function(d){
          var m = String(d.visited_at||'').match(/(\d+):(\d+):(\d+)/);
          if(m) hourly[parseInt(m[1])]++;
          if(d.path) pageMap[d.path]=(pageMap[d.path]||0)+1;
        });
        localHTML += '<div class="overview"><div><div class="n">'+visits.length+'</div><div class="l">本机访问</div></div>';
        localHTML += '<div><div class="n">'+Object.keys(pageMap).length+'</div><div class="l">不同页面</div></div></div>';
        localHTML += '<div class="section"><h2>🕐 时段分布（本机）</h2><div class="hour-grid">';
        var maxH = Math.max.apply(null, hourly) || 1;
        for(var i=0;i<24;i++){
          var pct = hourly[i]/maxH;
          localHTML += '<div class="hour-cell'+(pct>.6?' hot':pct>.3?' warm':'')+'"><span class="hc">'+(hourly[i]||0)+'</span>'+(i<10?'0':'')+i+':00</div>';
        }
        localHTML += '</div></div>';
        localHTML += '<div class="section"><h2>📄 页面访问（本机）</h2>';
        Object.keys(pageMap).sort(function(a,b){return pageMap[b]-pageMap[a];}).forEach(function(p){
          localHTML += '<div class="list-item"><span class="p">'+esc(p)+'</span><span class="c">'+pageMap[p]+'</span></div>';
        });
        localHTML += '</div></div>';
        localHTML += '<div class="section"><h2>📋 详细记录</h2><table><thead><tr><th>时间</th><th>页面</th><th>停留</th></tr></thead><tbody>';
        visits.slice(-30).reverse().forEach(function(d){
          var time = (d.visited_at||'').match(/(\d+):(\d+):(\d+)/);
          time = time ? (time[1]+':'+time[2]+':'+time[3]) : '';
          var dur = d.duration ? fmt(d.duration) : '--';
          localHTML += '<tr><td style="color:rgba(232,228,218,.4);font-size:.75rem">'+time+'</td><td class="p">'+esc(d.path||'/')+'</td><td style="font-size:.78rem;color:rgba(124,155,126,.7)">'+dur+'</td></tr>';
        });
        localHTML += '</tbody></table></div>';
      }
    }catch(le){ localHTML += '<div class="msg">读取本机记录失败：'+esc(le.message)+'</div>'; }
    document.getElementById('content').innerHTML = localHTML;
  }
}
function fmt(s){ if(s==null||s===undefined) return '--'; if(s<60) return s+'秒'; var m=Math.floor(s/60); var r=s%60; return m+'分'+r+'秒'; }
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// 通用 fetch + 超时（兼容性最好，不用 AbortSignal.timeout）
// 注册 Service Worker 让后续 fetch 走缓存兜底（2026-09-06）
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}

render();
</script>
</body>
</html>
