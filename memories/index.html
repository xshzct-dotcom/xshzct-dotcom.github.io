<!-- 博客画布（2026-09-15）：点「博客」从右侧滑入，不跳转新页面 -->
<div id="blogOverlay" aria-hidden="true" style="position:fixed;inset:0;z-index:95;background:var(--bg,#0E1116);opacity:0;visibility:hidden;overflow:hidden">
  <!-- 2026-09-15：顶部留出主页导航高度，避免 iframe 内容（含返回按钮）被导航遮挡 -->
  <iframe id="blogFrame" title="博客" style="width:100%;height:calc(100% - var(--nav-h,64px));margin-top:var(--nav-h,64px);border:0;display:block;background:var(--bg,#0E1116)"></iframe>
</div>
<script>
(function(){
  var ov = document.getElementById('blogOverlay');
  var fr = document.getElementById('blogFrame');
  if(!ov || !fr) return;
  var loaded = false, isOpen = false;
  window.isBlogOpen = function(){ return isOpen; };

  window.openBlog = function(){
    // 2026-09-15：首次加载 iframe；之后若曾进入文章页，则让它回到列表（避免残留）
    var url = 'moments.html?v=20260916-8';
    if(!loaded){
      fr.src = url; loaded = true;
    }else{
      // 只有在"上次停在文章页"时才重载，纯列表切换不重载（消除白屏闪烁）
      try{
        var inner = fr.contentWindow.location.search || '';
        if(inner.indexOf('id=') >= 0) fr.contentWindow.location.replace(url);
      }catch(e){
        // 跨域或读取失败时不做处理（保持现状，避免无谓重载）
      }
    }
    if(isOpen) return;
    isOpen = true;
    ov.setAttribute('aria-hidden', 'false');
    // 2026-09-15：锁住外层滚动，避免和 iframe 内滚动条同时出现
    document.documentElement.style.overflow = 'hidden';
    document.body.style.overflow = 'hidden';
    // 2026-09-15：去掉滑入动画，直接显示
    ov.style.opacity = '1';
    ov.style.visibility = 'visible';
    // 2026-09-15：导航高亮切到「博客」（#blog 无对应元素，否则会残留「随笔」高亮）
    try{
      window._blogNavLocked = true;
      var links = document.querySelectorAll('.nav-links a');
      for(var i = 0; i < links.length; i++) links[i].classList.remove('active');
      var bl = document.getElementById('navBlogLink');
      if(bl) bl.classList.add('active');
    }catch(e){}
    // 2026-09-15：不再写入 #blog（避免刷新后仍停在博客、也避免地址栏难看）
  };
  window.closeBlog = function(skipHistory){
    if(!isOpen) return;
    isOpen = false;
    ov.style.opacity = '0';
    ov.style.visibility = 'hidden';
    ov.setAttribute('aria-hidden', 'true');
    document.documentElement.style.overflow = '';
    document.body.style.overflow = '';
    // 2026-09-15：通知 iframe 停掉正在播放的文章音乐（iframe 不会自动销毁）
    try{ fr.contentWindow.postMessage('stop-iframe-music', '*'); }catch(e){}
    // 2026-09-15：解锁导航高亮，交回滚动位置判断
    try{
      window._blogNavLocked = false;
      var bl2 = document.getElementById('navBlogLink');
      if(bl2) bl2.classList.remove('active');
      window.dispatchEvent(new Event('scroll'));
    }catch(e){}
    if(!skipHistory && location.hash === '#blog'){
      try{ history.back(); }catch(e){}
    }
  };
  // 博客页点「← 返回」时通过 postMessage 通知主页收起
  var _resumeTimer = null;
  window.addEventListener('message', function(e){
    if(!e || !e.data) return;
    if(e.data === 'close-blog'){ window.closeBlog(); return; }
    // 2026-09-15：音乐互斥
    //  - 博客开播 → 取消待恢复的定时器 + 暂停主页背景乐
    //  - 博客停下 → 延迟 400ms 再恢复（若期间又开播则被取消，避免切歌时抖动）
    if(e.data === 'blog-music-play'){
      if(_resumeTimer){ clearTimeout(_resumeTimer); _resumeTimer = null; }
      try{ if(typeof window.pauseHomeMusic === 'function') window.pauseHomeMusic(); }catch(err){}
    }
    if(e.data === 'blog-music-stop'){
      if(_resumeTimer) clearTimeout(_resumeTimer);
      _resumeTimer = setTimeout(function(){
        _resumeTimer = null;
        try{ if(typeof window.resumeHomeMusic === 'function') window.resumeHomeMusic(); }catch(err){}
      }, 400);
    }
  });
  // 浏览器后退键
  window.addEventListener('popstate', function(){
    if(isOpen) window.closeBlog(true);
  });

  // 2026-09-15：刷新时【回到主页】（不自动打开博客），顺便清掉残留的 #blog
  if(location.hash === '#blog'){
    try{ history.replaceState(null, '', location.pathname + location.search); }catch(e){}
  }

  // 2026-09-15 性能：主页空闲时【预加载】博客 iframe（正文+数据+缩略图提前就绪）
  // 这样用户点「博客」时基本是秒开，而不是从零开始加载。
  (function(){
    function preload(){
      if(loaded || isOpen) return;
      var url = 'moments.html?v=20260916-8';
      loaded = true;
      fr.src = url;          // 提前加载；openBlog 里会因 loaded=true 而直接显示
      try{ fr.style.visibility = 'hidden'; }catch(e){}
      fr.addEventListener('load', function(){
        try{ fr.style.visibility = ''; }catch(e){}
      }, {once:true});
    }
    if('requestIdleCallback' in window){
      requestIdleCallback(preload, {timeout: 2500});     // 浏览器空闲时立刻做
    }else{
      setTimeout(preload, 1500);
    }
  })();
})();
</script>

<script>
// 灯箱核心 — 内联到 HTML，script.js 加载后会用自己的版本覆盖
// 如果 script.js 被 SW 缓存了旧版，这里的版本仍能工作
(function(){
  var _idx = 0, _total = 0;

  function open(idx) {
    var imgs = document.querySelectorAll('.masonry-item img');
    var photos = []; imgs.forEach(function(el){ photos.push(el.src); });
    _total = photos.length; _idx = Math.max(0, Math.min(idx, _total-1));
    if(_total === 0) return;

    var lb = document.getElementById('lightbox');
    var img = document.getElementById('lightboxImg');
    lb.style.opacity = '1'; lb.classList.add('active');
    document.body.style.overflow = 'hidden';

    // 原图: /thumbs/.../x.webp → /images/.../x.jpg
    img.src = photos[_idx].replace(/\/thumbs\//, '/images/').replace(/\.webp$/i, '.jpg');
    img.style.opacity = '0';
    img.onload = function(){ img.style.opacity = '1'; };
    document.getElementById('lightboxCounter').textContent = (_idx+1) + ' / ' + _total;
  }

  function close() {
    var lb = document.getElementById('lightbox');
    lb.classList.remove('active'); lb.style.opacity = '0';
    document.body.style.overflow = '';
  }

  function nav(dir) {
    _idx += dir;
    if(_idx < 0) _idx = _total - 1;
    if(_idx >= _total) _idx = 0;
    open(_idx);
  }

  // 暴露到 window（script.js 加载后会用自己的版本覆盖）
  window.openLightbox = open;
  window.closeLightbox = close;
  window.navLightbox = nav;

  // 别名兼容
  window.openLightboxFallback = open;
  window.closeLightboxFallback = close;

  // 键盘事件
  document.addEventListener('keydown', function(e) {
    var lb = document.getElementById('lightbox');
    if(!lb || !lb.classList.contains('active')) return;
    if(e.key === 'Escape') close();
    if(e.key === 'ArrowLeft') nav(-1);
    if(e.key === 'ArrowRight') nav(1);
  });

  // 测试按钮
  window._lbDebug = function(i) { console.log('[memories-fallback] photo onclick idx='+i); };
  document.addEventListener('DOMContentLoaded', function() {
    var btn = document.getElementById('testLb');
    if(btn) btn.onclick = function(e) { e.preventDefault(); console.log('[memories-fallback] test button clicked, calling open(0)'); open(0); };
  });
  setTimeout(function(){
    var btn = document.getElementById('testLb');
    if(btn) btn.onclick = function(e) { e.preventDefault(); console.log('[memories-fallback] test button (immediate) clicked'); open(0); };
  }, 100);
})();
</script>

<script>
// 访客统计（Supabase，后台记录，不在页面上显示，不被 adblock 拦截）
(function(){
  // 2026-09-12：排除自动化访问（AI 浏览器、爬虫、监控探针），避免污染真人统计
  // 说明：保活任务直接打 REST API、不执行页面 JS，本来就不会被记录；这里是防"用浏览器打开网站"的场景
  try{
    if(navigator.webdriver) return;   // 自动化浏览器（Playwright/Puppeteer/Selenium）会置为 true
    var _ua = navigator.userAgent || '';
    if(/HeadlessChrome|Puppeteer|Playwright|Selenium|PhantomJS|Lighthouse|bot\b|crawler|spider|scrapy/i.test(_ua)) return;
    if(window.__WB_AUTOMATION__) return;   // 预留：AI 工具可主动打标记
  }catch(e){}

  // 服务端去重：每个 tab/浏览器生成一个 client_id（用 localStorage 跨标签共享）
  var clientId;
  try {
    clientId = localStorage.getItem('visit_client_id');
    if(!clientId){
      clientId = 'c-' + Date.now() + '-' + Math.random().toString(36).slice(2, 10);
      localStorage.setItem('visit_client_id', clientId);
    }
  } catch(e) {
    clientId = 'c-tmp-' + Date.now();  // localStorage 不可用
  }

  // 30 秒内同 clientId + path 视为同一访问，跳过重复 POST
  // 2026-09-11 修正：去重状态改用 localStorage（跨标签页共享）
  // 原来用 sessionStorage（标签页私有）→ 同时开两个标签页时会各记一条（统计里出现"同一秒两条"）
  var _dedupKey = 'visit_posted_' + clientId + '_' + (location.pathname || '/');
  try {
    var last = parseInt(localStorage.getItem(_dedupKey) || '0');
    if (Date.now() - last < 30000) {
      return;
    }
    localStorage.setItem(_dedupKey, String(Date.now()));
  } catch(e) {}

  var key = 'sb_publishable_1yOf4jtKqK1GApN3InC7Gg_TUD2Barb';
  var base = 'https://mvzbkuhwapdqcdkekczh.supabase.co/rest/v1/visits';
  var _visitId = null;
  var _visitStartMs = Date.now();

  // 2026-09-06：本地也存一份访问记录（即使 Supabase 不通，统计页也能显示本机历史）
  // localStorage 结构：memories.visits = [{path, ref, visited_at, session_id, duration, left_at?}, ...]
  try{
    var localVisits = JSON.parse(localStorage.getItem('memories.visits') || '[]');
    localVisits.push({
      path: location.pathname || '/',
      ref: document.referrer || '',
      visited_at: new Date().toLocaleString('zh-CN', {timeZone:'Asia/Shanghai'}),
      session_id: clientId,
      duration: 0
    });
    // 最多保留最近 500 条
    if(localVisits.length > 500) localVisits = localVisits.slice(-500);
    localStorage.setItem('memories.visits', JSON.stringify(localVisits));
    window._localVisitIndex = localVisits.length - 1;   // 记录这次访问的索引，duration 更新时用
  }catch(e){}

  // 先查最近 30 秒内是否已有这个 client_id+path 的访问记录，如果有就 PATCH 而不是 POST
  var since = new Date(Date.now() - 30000).toISOString();   // 2026-09-10 修正：标准 UTC（原来北京时间字符串被按 UTC 解释，导致 8 小时偏差）
  fetch(base + '?select=id,visited_at&session_id=eq.' + clientId + '&path=eq.' + encodeURIComponent(location.pathname || '/') + '&visited_at=gte.' + encodeURIComponent(since) + '&order=visited_at.desc&limit=1', {
    headers: {'apikey':key,'Authorization':'Bearer '+key}
  }).then(function(r){ return r.json(); }).then(function(rows){
    if(rows && rows.length > 0){
      _visitId = rows[0].id;
      return;
    }
    // 2026-09-15：查询 IP 归属地（多源 + 6 秒超时，失败不影响主流程）
    function _geo(){
      return new Promise(function(res){
        var done = false;
        var t = setTimeout(function(){ if(!done){ done = true; res({}); } }, 6000);
        function ok(g){
          if(done) return;
          done = true; clearTimeout(t);
          res({
            ip: (g && g.ip) || '',
            country: (g && (g.country || (g.location && g.location.country))) || '',
            region: (g && (g.region || g.province || (g.location && g.location.state))) || '',
            city: (g && (g.city || (g.location && g.location.city))) || ''
          });
        }
        function fail(){ if(!done){ done = true; clearTimeout(t); res({}); } }
        // 主源：ipwho.is（CORS 友好）
        fetch('https://ipwho.is/', {cache:'no-store'})
          .then(function(r){ return r.json(); })
          .then(function(g){ if(g && g.success !== false && g.ip) ok(g); else throw new Error('bad'); })
          .catch(function(){
            // 备源：api.ipapi.is（国内可达，字段在 location 下）
            fetch('https://api.ipapi.is/', {cache:'no-store'})
              .then(function(r){ return r.json(); })
              .then(function(g){ if(g && g.ip) ok(g); else throw new Error('bad'); })
              .catch(fail);
          });
      });
    }
    return _geo().then(function(geo){
      return fetch(base, {
        method: 'POST',
        headers: {'apikey':key,'Authorization':'Bearer '+key,'Content-Type':'application/json','Prefer':'return=representation'},
        body: JSON.stringify({
          path: location.pathname,
          ref: document.referrer || '',
          visited_at: new Date().toISOString(),   // 2026-09-10 修正：标准 UTC
          session_id: clientId,
          // 2026-09-15 增强：区分自己人/外人 + 设备 + IP 归属地
          ua: navigator.userAgent || '',
          is_authed: (function(){ try{ return localStorage.getItem('_v2pw2') === '1'; }catch(e){ return false; } })(),
          screen: (window.screen ? (screen.width + 'x' + screen.height) : ''),
          lang: navigator.language || '',
          tz: (function(){ try{ return Intl.DateTimeFormat().resolvedOptions().timeZone || ''; }catch(e){ return ''; } })(),
          ip: geo.ip || null,
          country: geo.country || null,
          region: geo.region || null,
          city: geo.city || null
        })
      }).then(function(r){ return r.json(); }).then(function(data){
        _visitId = data && data[0] && data[0].id;
      });
    });
  }).then(function(){
    if(!_visitId) return;
    // 2026-09-15：通过密码后主动把本次访问标记为「自己人」
    window._markAuthed = function(){
      try{
        fetch(base + '?id=eq.' + _visitId, {
          method: 'PATCH',
          headers: {'apikey':key,'Authorization':'Bearer '+key,'Content-Type':'application/json'},
          body: JSON.stringify({is_authed: true}),
          keepalive: true
        }).catch(function(){});
      }catch(e){}
    };
    function save(){
      var dur = Math.max(1, Math.round((Date.now() - _visitStartMs) / 1000));
      var payload = JSON.stringify({duration: dur, left_at: new Date().toISOString()});
      // sendBeacon 只能发 POST，不适合 PATCH；直接用 fetch PATCH（keepalive 保证页面关闭时送达）
      fetch(base+'?id=eq.'+_visitId, { method:'PATCH', headers:{'apikey':key,'Authorization':'Bearer '+key,'Content-Type':'application/json'}, body: payload, keepalive: true }).catch(function(){});
      // 同步更新 localStorage 的 duration（供统计页 fallback 显示）
      try{
        var idx = window._localVisitIndex;
        if(typeof idx === 'number'){
          var arr = JSON.parse(localStorage.getItem('memories.visits') || '[]');
          if(arr[idx]){ arr[idx].duration = dur; localStorage.setItem('memories.visits', JSON.stringify(arr)); }
        }
      }catch(e){}
    }
    setInterval(save, 10000);
    window.addEventListener('beforeunload', save);
    document.addEventListener('visibilitychange', function(){ if(document.hidden) save(); });
  }).catch(function(){});
})();
</script>
<script>
// Service Worker 注册（2026-08-11 启用：加速二次访问 + 离线回退）
if('serviceWorker' in navigator){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js?v=20260916-8').catch(function(e){
      console.warn('[SW] register failed:', e);
    });
  });
}
</script>
