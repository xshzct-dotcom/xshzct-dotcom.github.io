<style>body{font-family:'Inter','Noto Serif SC',system-ui,sans-serif;background:#0E1116;color:#E8E4DA;margin:0}
/* 灯箱核心 CSS — 内联!important 确保 SW 缓存旧版 style.css 也不影响 */
.lightbox{position:fixed;inset:0;z-index:200;background:#000;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s;overflow:hidden}
.lightbox.active{opacity:1!important;pointer-events:auto!important}
.lightbox-stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:zoom-in}
.lightbox-img{max-width:92vw;max-height:88vh;object-fit:contain;user-select:none;-webkit-user-drag:none}
.lightbox-close,.lightbox-prev,.lightbox-next{position:fixed;z-index:201;width:44px;height:44px;border-radius:50%;font-size:1.5rem;color:#E8E4DA;background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.1);transition:all .2s}
.lightbox-close{top:20px;right:24px}.lightbox-prev{left:20px;top:50%;transform:translateY(-50%)}.lightbox-next{right:20px;top:50%;transform:translateY(-50%)}
.lightbox-counter{position:fixed;top:24px;left:50%;transform:translateX(-50%);z-index:201;color:#E8E4DA;font-size:.85rem;letter-spacing:.5px}
.lightbox-filmstrip{position:fixed;bottom:0;left:0;right:0;z-index:201;display:flex;gap:6px;overflow-x:auto;padding:12px 16px;background:linear-gradient(0deg,#000 60%,transparent)}
.lightbox-filmstrip .fs-item{flex:0 0 auto;width:64px;height:64px;border-radius:4px;overflow:hidden;border:2px solid transparent;cursor:pointer;transition:border .2s}
.lightbox-filmstrip .fs-item.active{border-color:#7C9B7E}
.lightbox-filmstrip .fs-item img{width:100%;height:100%;object-fit:cover}
</style>

    <div style="font-size:1.6rem;margin-bottom:12px;font-family:var(--font-display,'Playfair Display',serif);font-style:italic;color:var(--accent,#7C9B7E)">✦</div>

<script src="../data.js?v=20260726-2"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>
// 灯箱核心 — 内联到 HTML，script.js 加载后会用自己的版本覆盖
// 如果 script.js 被 SW 缓存了旧版，这里的版本仍能工作
(function(){
  var _idx = 0, _total = 0;

  function open(idx) {
    var imgs = document.querySelectorAll('.masonry-item img');
    var photos = []; imgs.forEach(function(el){ photos.push(el.src); });
    _total = photos.length; _idx = Math.max(0, Math.min(idx, _total-1));
    if(_total === 0) return;

    var lb = document.getElementById('lightbox');
    var img = document.getElementById('lightboxImg');
    lb.style.opacity = '1'; lb.classList.add('active');
    document.body.style.overflow = 'hidden';

    // 原图: /thumbs/.../x.webp → /images/.../x.jpg
    img.src = photos[_idx].replace(/\/thumbs\//, '/images/').replace(/\.webp$/i, '.jpg');
    img.style.opacity = '0';
    img.onload = function(){ img.style.opacity = '1'; };
    document.getElementById('lightboxCounter').textContent = (_idx+1) + ' / ' + _total;
  }

  function close() {
    var lb = document.getElementById('lightbox');
    lb.classList.remove('active'); lb.style.opacity = '0';
    document.body.style.overflow = '';
  }

  function nav(dir) {
    _idx += dir;
    if(_idx < 0) _idx = _total - 1;
    if(_idx >= _total) _idx = 0;
    open(_idx);
  }

  // 暴露到 window（script.js 加载后会用自己的版本覆盖）
  window.openLightbox = open;
  window.closeLightbox = close;
  window.navLightbox = nav;

  // 别名兼容
  window.openLightboxFallback = open;
  window.closeLightboxFallback = close;

  // 键盘事件
  document.addEventListener('keydown', function(e) {
    var lb = document.getElementById('lightbox');
    if(!lb || !lb.classList.contains('active')) return;
    if(e.key === 'Escape') close();
    if(e.key === 'ArrowLeft') nav(-1);
    if(e.key === 'ArrowRight') nav(1);
  });

  // 测试按钮
  console.log('[memories-fallback] ready, photos='+document.querySelectorAll('.masonry-item img').length);
  window._lbDebug = function(i) { console.log('[memories-fallback] photo onclick idx='+i); };
  document.addEventListener('DOMContentLoaded', function() {
    var btn = document.getElementById('testLb');
    if(btn) btn.onclick = function(e) { e.preventDefault(); console.log('[memories-fallback] test button clicked, calling open(0)'); open(0); };
  });
  setTimeout(function(){
    var btn = document.getElementById('testLb');
    if(btn) btn.onclick = function(e) { e.preventDefault(); console.log('[memories-fallback] test button (immediate) clicked'); open(0); };
  }, 100);
})();
</script>
<script src="script.js?v=20260726-17"></script>
<script src="editor.js?v=20260726-17"></script>
<script>
// 访客统计（Supabase，后台记录，不在页面上显示，不被 adblock 拦截）
(function(){
  // 服务端去重：每个 tab/浏览器生成一个 client_id（用 localStorage 跨标签共享）
  var clientId;
  try {
    clientId = localStorage.getItem('visit_client_id');
    if(!clientId){
      clientId = 'c-' + Date.now() + '-' + Math.random().toString(36).slice(2, 10);
      localStorage.setItem('visit_client_id', clientId);
    }
  } catch(e) {
    clientId = 'c-tmp-' + Date.now();  // localStorage 不可用
  }

  // 30 秒内同 clientId + path 视为同一访问，跳过重复 POST
  var _dedupKey = 'visit_posted_' + clientId + '_' + (location.pathname || '/');
  try {
    var last = parseInt(sessionStorage.getItem(_dedupKey) || '0');
    if (Date.now() - last < 30000) {
      return;
    }
    sessionStorage.setItem(_dedupKey, String(Date.now()));
  } catch(e) {}

  var key = 'sb_publishable_1yOf4jtKqK1GApN3InC7Gg_TUD2Barb';
  var base = 'https://mvzbkuhwapdqcdkekczh.supabase.co/rest/v1/visits';
  var _t0 = Date.now();
  var _acc = 0;

  // 先查最近 30 秒内是否已有这个 client_id+path 的访问记录，如果有就 PATCH 而不是 POST
  var since = new Date(Date.now() - 30000).toLocaleString('zh-CN', {timeZone:'Asia/Shanghai'});
  fetch(base + '?select=id,visited_at&session_id=eq.' + clientId + '&path=eq.' + encodeURIComponent(location.pathname || '/') + '&visited_at=gte.' + encodeURIComponent(since) + '&order=visited_at.desc&limit=1', {
    headers: {'apikey':key,'Authorization':'Bearer '+key}
  }).then(function(r){ return r.json(); }).then(function(rows){
    if(rows && rows.length > 0){
      // 已有最近访问，更新时间戳和 left_at
      return fetch(base + '?id=eq.' + rows[0].id, {
        method: 'PATCH',
        headers: {'apikey':key,'Authorization':'Bearer '+key,'Content-Type':'application/json'},
        body: JSON.stringify({visited_at: new Date().toLocaleString('zh-CN', {timeZone:'Asia/Shanghai'}), left_at: new Date().toLocaleString('zh-CN', {timeZone:'Asia/Shanghai'}), duration: 0})
      }).then(function(){ rows[0].id; });
    }
    // 没有就 POST 新记录
    return fetch(base, {
      method: 'POST',
      headers: {'apikey':key,'Authorization':'Bearer '+key,'Content-Type':'application/json','Prefer':'return=representation'},
      body: JSON.stringify({
        path: location.pathname,
        ref: document.referrer || '',
        visited_at: new Date().toLocaleString('zh-CN', {timeZone:'Asia/Shanghai'}),
        session_id: clientId
      })
    }).then(function(r){ return r.json(); });
  }).then(function(data){
    var visitId = data && data[0] && data[0].id;
    if(!visitId) return;
    function patch(done){
      var now = Date.now();
      var seg = Math.round((now - _t0) / 1000);
      if(seg < 0) seg = 0;
      if(!done) seg = Math.max(seg, 1);
      var dur = _acc + seg;
      if(done) _acc = dur; else _acc += Math.floor((now - _t0) / 1000);
      if(!done && !document.hidden) _t0 = now;
      fetch(base+'?id=eq.'+visitId, {
        method: 'PATCH',
        headers: {'apikey':key,'Authorization':'Bearer '+key,'Content-Type':'application/json'},
        body: JSON.stringify({left_at: new Date().toLocaleString('zh-CN', {timeZone:'Asia/Shanghai'}), duration: dur})
      }).catch(function(){});
    }
    window.addEventListener('beforeunload', function(){ patch(true); });
    document.addEventListener('visibilitychange', function(){ patch(document.hidden); });
    setInterval(function(){ if(!document.hidden) patch(false); }, 10000);
  }).catch(function(){});
})();
</script>
