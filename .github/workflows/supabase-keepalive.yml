name: Supabase Keep-Alive

# 目的：定期自动访问 Supabase，防止免费项目因 7 天无 API 调用被自动暂停
# 说明：GitHub Actions 运行在海外服务器，可访问 supabase.co，不依赖本机开机
# 2026-09-12 优化：原来每周只跑 1 次（恰好卡在 7 天暂停边界，GitHub 一旦延迟就会踩线）
#                 → 改为每周 2 次（周一 + 周四），最坏间隔 4 天，安全余量充足

on:
  schedule:
    # 每周一、周四 03:00 UTC = 北京时间 11:00
    - cron: '0 3 * * 1,4'
  workflow_dispatch: {}   # 支持手动点击 "Run workflow" 立即触发

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          fail=0
          # 依次 ping 两张关键表：essays（文章）+ posts（动态），任一成功即视为项目活跃
          for tbl in essays posts; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
              -H "apikey: sb_publishable_1yOf4jtKqK1GApN3InC7Gg_TUD2Barb" \
              -H "Authorization: Bearer sb_publishable_1yOf4jtKqK1GApN3InC7Gg_TUD2Barb" \
              "https://mvzbkuhwapdqcdkekczh.supabase.co/rest/v1/${tbl}?select=id&limit=1")
            echo "${tbl} HTTP status: $code"
            if [ "$code" = "200" ]; then fail=0; else fail=$((fail+1)); fi
          done
          if [ "$fail" -ge 2 ]; then
            echo "::warning::Supabase 两张表都不可达，可能项目又被暂停了，请检查"
            exit 1
          fi
          echo "OK: Supabase 项目活跃 ✅"
